<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Plan Alimentaire — 4 semaines</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Alim.">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ==========================================================
   1. VARIABLES & RESET
   ========================================================== */
:root{
  --bg:#0b1020;            /* fond très sombre bleuté */
  --bg-soft:#111832;       /* fond des cartes */
  --bg-softer:#182142;     /* survol / éléments internes */
  --border:#232e55;
  --txt:#e8ecf8;
  --txt-dim:#98a3c7;
  --green:#3ddc84;         /* progression / validé */
  --green-dark:#123626;
  --blue:#5b9dff;          /* jours handball */
  --blue-dark:#12244a;
  --orange:#ffb454;        /* avertissements */
  --orange-dark:#3a2a10;
  --radius:16px;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:radial-gradient(1000px 500px at 80% -10%,#16224a55,transparent),
                   radial-gradient(800px 400px at -10% 30%,#0f2b2455,transparent);
  color:var(--txt);
  font-family:var(--font);
  line-height:1.55;
  min-height:100vh;
  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ==========================================================
   2. EN-TÊTE & NAVIGATION
   ========================================================== */
header{
  padding:28px 16px 8px;
  text-align:center;
}
header h1{
  font-size:clamp(1.5rem,4vw,2.3rem);
  font-weight:800;
  letter-spacing:-.5px;
}
header h1 span{color:var(--green)}
header p{color:var(--txt-dim);font-size:.95rem;margin-top:4px}

nav{
  position:sticky;top:0;z-index:50;
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 16px;
  background:rgba(11,16,32,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;
  background:var(--bg-soft);
  color:var(--txt-dim);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 16px;
  font-size:.9rem;font-weight:600;
  transition:all .25s ease;
}
nav button:hover{color:var(--txt);border-color:var(--green)}
nav button.active{
  background:var(--green);color:#04120a;border-color:var(--green);
  box-shadow:0 0 18px #3ddc8455;
}

main{max-width:900px;margin:0 auto;padding:20px 16px}
.page{display:none;animation:fadeIn .35s ease}
.page.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==========================================================
   3. CARTES GÉNÉRIQUES
   ========================================================== */
.card{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}
.card h2{font-size:1.25rem;margin-bottom:12px}
.card h2 .dot{color:var(--green)}
.muted{color:var(--txt-dim);font-size:.9rem}

/* Grille de stats (accueil) */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-top:8px;
}
.stat{
  background:var(--bg-softer);
  border:1px solid var(--border);
  border-radius:12px;padding:14px;text-align:center;
  transition:transform .2s ease;
}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:1.5rem;color:var(--green)}
.stat.blue b{color:var(--blue)}
.stat small{color:var(--txt-dim)}

/* Avertissement */
.warn{
  background:var(--orange-dark);
  border:1px solid var(--orange);
  border-radius:12px;
  color:var(--orange);
  padding:12px 14px;font-size:.9rem;
  margin-top:12px;
  display:flex;gap:10px;align-items:flex-start;
}

/* Badge handball */
.badge-hb{
  display:inline-block;background:var(--blue-dark);color:var(--blue);
  border:1px solid var(--blue);border-radius:999px;
  font-size:.72rem;font-weight:700;padding:2px 10px;margin-left:8px;
  vertical-align:middle;
}

/* ==========================================================
   4. BARRES DE PROGRESSION
   ========================================================== */
.progress{
  background:var(--bg-softer);
  border-radius:999px;height:12px;overflow:hidden;
  border:1px solid var(--border);
}
.progress > div{
  height:100%;width:0%;
  background:linear-gradient(90deg,#1fae62,var(--green));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label{
  display:flex;justify-content:space-between;
  font-size:.82rem;color:var(--txt-dim);margin:10px 0 6px;
}
.celebrate{
  display:none;text-align:center;font-weight:700;
  color:var(--green);margin-top:10px;
  animation:pop .5s ease;
}
.celebrate.on{display:block}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* ==========================================================
   5. ACCORDÉON JOURS
   ========================================================== */
.day{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color .3s;
}
.day.handball{border-color:var(--blue)}
.day.done{border-color:var(--green)}
.day-head{
  width:100%;display:flex;align-items:center;gap:12px;
  background:transparent;border:none;color:var(--txt);
  padding:16px;text-align:left;
}
.day-head:hover{background:var(--bg-softer)}
.day-head .day-name{font-weight:700;font-size:1.05rem;flex:1}
.day-head .kcal{font-size:.78rem;color:var(--txt-dim);display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.3;text-align:right}
.day-head .chev{transition:transform .3s;color:var(--txt-dim)}
.day.open .chev{transform:rotate(180deg)}
.day-body{
  max-height:0;overflow:hidden;
  transition:max-height .45s ease;
  padding:0 14px;
}
.day.open .day-body{padding-bottom:14px}
.day .progress{height:8px;margin:0 16px 0}
.day .day-prog-wrap{padding:0 16px 14px}
.day-msg{font-size:.85rem;font-weight:700;color:var(--green);padding:0 16px 12px;display:none}
.day-msg.on{display:block;animation:pop .4s ease}

/* ==========================================================
   6. REPAS
   ========================================================== */
.meal{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--bg-softer);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;margin-top:10px;
  transition:background .3s,border-color .3s;
}
.meal.checked{
  background:var(--green-dark);
  border-color:var(--green);
}
.meal input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:22px;height:22px;flex:0 0 22px;margin-top:2px;
  border:2px solid var(--txt-dim);border-radius:7px;
  background:transparent;cursor:pointer;position:relative;
  transition:all .2s;
}
.meal input[type=checkbox]:checked{
  background:var(--green);border-color:var(--green);
}
.meal input[type=checkbox]:checked::after{
  content:"✓";position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#04120a;font-weight:900;font-size:.9rem;
}
.meal-info{flex:1}
.meal-type{
  font-size:.72rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--txt-dim);font-weight:700;
}
.meal.checked .meal-type{color:var(--green)}
.meal-name{font-weight:700;margin:2px 0 4px}
.meal ul{list-style:none;font-size:.86rem;color:var(--txt-dim)}
.meal ul li::before{content:"– "}
.qr{color:var(--green)}
.qh{color:#c792ea}
.meal ul li .qr,.meal ul li .qh{white-space:nowrap}
.meal ul li .qr b,.meal ul li .qh b{font-weight:700}
.meal ul li .qr{margin-right:6px}
.meal-meta{flex-wrap:wrap}
.who{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:8px 0 2px}
.portions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.portions label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--txt-dim)}
.portions input{width:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:8px;font-family:inherit}
.portions input:focus{border-color:var(--green);outline:none}
.meal-note{font-size:.8rem;color:var(--txt-dim);font-style:italic;margin-top:6px}
.meal-meta{
  display:flex;gap:12px;margin-top:6px;
  font-size:.78rem;color:var(--txt-dim);
}
.meal-meta span{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.meal.checked .meal-meta span{border-color:var(--green);color:var(--green)}

/* Petit-déjeuner : deux versions côte à côte */
.pdj-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pdj-split > div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
.pdj-split b{font-size:.86rem}
@media (max-width:600px){.pdj-split{grid-template-columns:1fr}}

/* ==========================================================
   7. LISTES DE COURSES & TABLEAUX
   ========================================================== */
.rayon h3{
  color:var(--green);font-size:.95rem;
  margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px;
}
.rayon ul{list-style:none}
.rayon li{
  padding:6px 0;border-bottom:1px dashed var(--border);
  font-size:.92rem;display:flex;justify-content:space-between;gap:10px;
}
.rayon li span:last-child{color:var(--txt-dim);white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--txt-dim);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
td input[type=number],td input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;
}
td input:focus{border-color:var(--green);outline:none}

/* Batch cooking : étapes */
.step{
  display:flex;gap:14px;margin-top:14px;align-items:flex-start;
}
.step .num{
  flex:0 0 34px;height:34px;border-radius:50%;
  background:var(--green-dark);color:var(--green);
  border:1px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-weight:800;
}
.step b{display:block}
.step small{color:var(--txt-dim)}

/* Boutons d'action (sauvegarde) */
.btn{
  background:var(--bg-softer);color:var(--txt);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 16px;font-weight:600;font-size:.9rem;
  margin:6px 8px 0 0;transition:all .2s;
}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);color:#04120a;border-color:var(--green)}


/* Onglet Rotations */
.rot{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.rot.current{border-color:var(--green)}
.rot > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px;font-weight:700;font-size:1.05rem}
.rot > summary::-webkit-details-marker{display:none}
.rot > summary:hover{background:var(--bg-softer)}
.rot > summary .chev{margin-left:auto;color:var(--txt-dim);transition:transform .3s}
.rot[open] > summary .chev{transform:rotate(180deg)}
.badge-cur{background:var(--green-dark);color:var(--green);border:1px solid var(--green);border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 10px}
.rot-body{padding:0 16px 16px}
.rot-body h3{font-size:.95rem;color:var(--green);margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px}
.rot-body h3 small{color:var(--txt-dim);text-transform:none;letter-spacing:0;font-weight:500}
.rot-body td:first-child{font-weight:700;white-space:nowrap}
.rot-body td{font-size:.85rem;vertical-align:top}
.rot-body tr.we td{color:var(--txt-dim)}

/* ==========================================================
   8. RESPONSIVE & ACCESSIBILITÉ
   ========================================================== */
@media (max-width:600px){
  .card{padding:16px}
  .meal{flex-wrap:wrap}
  .day-head{padding:14px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ==========================================================

   de repas déjà équilibré. Chaque rotation réordonne les mêmes
   4 semaines et mélange les jours de semaine (lundi→vendredi),
   samedi (plaisir + plat asiatique) et dimanche (batch) restant
   des repères fixes. Change de rotation via le bouton dans
   l'onglet Accueil, sans avoir à redemander un nouveau plan.
   ========================================================== */
const ROTATION_WEEK_ORDER = [ [0,1,2,3], [1,2,3,0], [2,3,0,1] ];
const ROTATION_DAY_PERM   = [ [0,1,2,3,4,5,6], [2,3,4,0,1,5,6], [4,0,1,2,3,5,6] ];
const NB_ROTATIONS = ROTATION_WEEK_ORDER.length;

function buildSemaines(r){
  const perm = ROTATION_DAY_PERM[r];
  return ROTATION_WEEK_ORDER[r].map(origIdx=>{
    const week = perm.map(origDay => WEEK_CONTENT[origIdx][origDay].slice());
    week.forEach((day,d)=>{ day[0] = BREAKFAST_ROT[d]; day[2] = COLLATION_ROT[d]; });
    return week;
  });
}
function buildListes(r){
  /* Les courses doivent suivre exactement les jours réellement affichés dans la rotation. */
  return buildSemaines(r).map(buildListeSemaine);
}

/* ==========================================================
   PORTIONS, COURSES & BUDGET
   Chaque personne choisit son objectif kcal/jour : les quantités sont
   mises à l'échelle (F = moi, FA = l'autre personne). Les courses et le
   budget additionnent les deux portions.
   ========================================================== */
const CIBLE_MOI_DEFAUT = 1900, CIBLE_AUTRE_DEFAUT = 1200;
let F = 1, FA = 1, R = 1;   /* F : facteur de Raph (= R) · FA : Hannah · R : repère de Raph = objectif / 1 900 */
const RAYONS = ["Boucherie / Volaille","Poissonnerie","Fruits & Légumes","Épicerie","Crèmerie","Surgelés"];

function echelle(c,f){ return c.sc ? 1+(f-1)*c.sc : 1; }
function arrondi(v){ return v>=100 ? Math.round(v/10)*10 : Math.round(v/5)*5; }
function arrondiU(c,v){
  if(c.u==="g") return arrondi(v);
  if(c.u==="tr") return Math.max(1,Math.round(v));
  if(c.u==="boite"||c.u==="pc") return Math.max(0.5,Math.round(v*2)/2);
  return v;
}
/* Un repas "fixe" (les deux petits-déjeuners de Raph) n'est pas mis à l'échelle en unités ; les quantités en grammes suivent le repère R. */
function fm(id,f){
  if(MEALS[id].fixe) return 1;
  if(id.startsWith("col_")) return f===1 ? 1 : 1+(f-1)*1.8;   /* goûter plus consistant */
  return f;
}
/* Compléments propres à Raph (champ plus du repas) */
function extrasRaph(id){ return (MEALS[id].plus||[]).map(x=>[x[0],x[1],x[2],x[3],true]); }
/* Ingrédients d'un repas pour une personne. Pour Raph : quantités imposées (champ raph) + compléments */
function ingPour(id,qui){
  if(qui!=="raph") return MEALS[id].ing;
  const ov = MEALS[id].raph || {};
  return MEALS[id].ing.map(i=>{
    const o = ov[i[2]];
    if(o===undefined) return i;
    return Array.isArray(o) ? [i[0], o[1], i[2], o[0], true] : [i[0], o+" g", i[2], o, true];
  }).concat(extrasRaph(id));
}
/* Raph : quantités imposées (5e élément = true). Les quantités en grammes suivent le repère R (objectif / 1 900) */
function montant(i,f){
  if(i[4]){ const c0 = CAT[i[2]]; return (c0.u==="g" && R!==1) ? arrondiU(c0,i[3]*R) : i[3]; }
  const c = CAT[i[2]], s = echelle(c,f); return s===1 ? i[3] : arrondiU(c,i[3]*s); }
function frac(v){ const e = Math.floor(v), r = v-e; if(r<0.25) return String(e); if(r<0.75) return (e?e+" ":"")+"1/2"; return String(e+1); }
function virg(x){ return String(x).replace(".",","); }

/* Quantité affichée dans un repas pour le facteur f (quantité du programme si le produit ne change pas) */
function qteAff(i,f){
  if(!i[2]) return i[1];
  const c = CAT[i[2]];
  if(i[4]) return (c.u==="g" && R!==1) ? montant(i,f)+" g" : i[1];
  if(echelle(c,f)===1) return i[1];
  const a = montant(i,f);
  if(i[2]==="raisin") return a+" g (ou "+Math.max(1,Math.round(a/50))+" clémentines)";
  if(c.fmt==="pots60") return a+" g (≈ "+virg(Math.round(a/30)/2)+" pots)";
  if(c.fmt==="tr40") return a+" g (≈ "+virg(Math.round(a/20)/2)+" tranches)";
  if(c.u==="tr") return a+" tranche"+(a>1?"s":"");
  if(c.u==="boite") return frac(a)+" boîte"+(a>1?"s":"")+" (≈ "+Math.round(a*110/5)*5+" g)";
  if(c.u==="pc") return frac(a);
  return a+" g";
}

/* Légumes : quantité par personne (« 200 g/p ») */
const LEGUMES = ["courgettes","poivrons","brocolis","hv","tomates","concombre"];
function qteP(i,t){ return LEGUMES.includes(i[2]) ? t.replace(/(\d+ g)/,"$1/p") : t; }

/* Calories et protéines d'un repas pour le facteur f */
function nutriRepas(id,f,qui){
  if(id==="l_plaisir") return {kcal:1000,prot:0};
  let kc = 0, pr = 0;
  ingPour(id,qui).forEach(i=>{
    if(!i[2]) return;
    const c = CAT[i[2]], a = montant(i,fm(id,f)), k = c.u==="g" ? a/100 : a;
    kc += c.kc*k; pr += c.pr*k;
  });
  return {kcal:Math.round(kc/5)*5, prot:Math.round(pr)};
}
/* Moyenne par jour sur les 4 semaines (hors repas plaisir, ou repas plaisir compris si pl) */
function moyJour(champ,f,qui,pl){
  let t = 0, n = 0;
  WEEK_CONTENT.forEach(w=>w.forEach((day,d)=>{
    [qui==="raph"?PDJ_RAPH_ROT[d]:BREAKFAST_ROT[d],day[1],qui==="raph"?collationRaphId(d):COLLATION_ROT[d],day[3]].forEach(id=>{
      if(id!=="l_plaisir" || pl) t += nutriRepas(id,f,qui)[champ];
    });
    n++;
  }));
  return t/n;
}
/* Facteur de portion qui se rapproche le plus de l'objectif kcal/jour */
function facteurPour(cible,qui){
  /* proche du programme d'origine (à ± 60 kcal) : on garde exactement ses quantités */
  if(Math.abs(moyJour("kcal",1,qui)-cible)<=60) return 1;
  let best = 1, bd = 1e9;
  for(let f=0.6; f<=3.0001; f+=0.01){
    const dd = Math.abs(moyJour("kcal",f,qui)-cible);
    if(dd<bd){ bd = dd; best = f; }
  }
  return Math.round(best*100)/100;
}

/* Totaux d'une semaine : portion de chacun additionnée */
function totauxSemaine(week){
  const tot = {};
  week.forEach((day,d)=>{
    [[PDJ_RAPH_ROT[d],F,"raph"],[BREAKFAST_ROT[d],FA,"h"]].forEach(([pdj,f,qui])=>{
      [pdj, day[1], qui==="raph"?collationRaphId(d):COLLATION_ROT[d], day[3]].forEach(id=>{
        ingPour(id,qui).forEach(i=>{ if(i[2]) tot[i[2]] = (tot[i[2]]||0) + montant(i,fm(id,f)); });
      });
    });
  });
  return tot;
}
function fmtQte(c,q){
  if(c.fmt==="pots60") return "≈ "+Math.ceil(q/60)+" pots (60 g)";
  if(c.fmt==="tr40") return "≈ "+Math.ceil(q/40)+" tranches";
  if(c.fmt==="carre20") return "≈ "+Math.ceil(q/20)+" carré"+(Math.ceil(q/20)>1?"s":"")+" (20 g)";
  if(c.fmt==="tranches") return Math.ceil(q)+" tranches";
  if(c.fmt==="boites") return Math.ceil(q)+" boîte"+(Math.ceil(q)>1?"s":"");
  if(c.fmt==="gousses") return Math.ceil(q)+" gousses";
  if(c.fmt==="n") return String(Math.ceil(q));
  if(q>=1000) return "≈ "+(q/1000).toFixed(1).replace(".",",")+" kg";
  return "≈ "+arrondi(q)+" g";
}
function buildListeSemaine(week){
  const tot = totauxSemaine(week), liste = {};
  RAYONS.forEach(r=>liste[r]=[]);
  const placard = new Set();
  Object.keys(tot).forEach(k=>{
    const c = CAT[k];
    if(c.u==="herb") return;
    if(c.u==="cs"||c.u==="cc"||c.u==="pm"){ placard.add(c.nom.toLowerCase().replace("provence","Provence")); return; }
    liste[c.rayon].push([c.nom, fmtQte(c,tot[k])]);
  });
  RAYONS.forEach(r=>liste[r].sort((a,b)=>a[0].localeCompare(b[0],"fr")));
  /* herbes fraîches : on liste les variétés réellement utilisées */
  const noms = new Set();
  week.forEach((day,d)=>[BREAKFAST_ROT[d],day[1],COLLATION_ROT[d],day[3]].forEach(id=>
    MEALS[id].ing.forEach(i=>{ if(i[2] && CAT[i[2]].u==="herb") noms.add(i[0].replace(/ frais$/,"").replace(/ fraîche$/,"").toLowerCase()); })));
  if(noms.size) liste["Fruits & Légumes"].push(["Herbes fraîches & gingembre", [...noms].join(", ")]);
  if(placard.size) liste["Épicerie"].push(["Fond de placard", [...placard].join(", ")]);
  RAYONS.forEach(r=>{ if(!liste[r].length) delete liste[r]; });
  return liste;
}
function majPortions(){
  R = Math.min(1.6,Math.max(0.6,state.cible/1900));
  F = R;
  FA = facteurPour(state.cibleAutre);
}

/* Budget : prix moyens en supermarché discount (estimation), moyenne des 4 semaines */
function fourchette(x){ return "≈ "+Math.max(1,Math.floor(x*0.92))+"-"+Math.ceil(x*1.08)+" €"; }
function calcBudget(){
  const par = {};
  RAYONS.forEach(r=>par[r]=0);
  WEEK_CONTENT.forEach(w=>{
    const tot = totauxSemaine(w);
    Object.keys(tot).forEach(k=>{
      const c = CAT[k];
      if(!c.prix) return;
      par[c.rayon] += (c.u==="g" ? tot[k]/1000*c.prix : tot[k]*c.prix)/WEEK_CONTENT.length;
    });
  });
  return {
    lignes: RAYONS.filter(r=>par[r]>0).map(r=>[r, fourchette(par[r])]),
    total: fourchette(Object.values(par).reduce((a,b)=>a+b,0))
  };
}

/* ==========================================================
   DONNÉES — Batch cooking du dimanche (~45 min, pour 2)
   ========================================================== */
const BATCH = [
  ["Lancer les féculents","Riz basmati, boulgour, quinoa, blé et pâtes complètes (selon la semaine) dans des casseroles séparées, en poids cru. Tout cuit pendant que tu fais le reste.","0 → 25 min"],

];

/* ==========================================================

const KEY = "planAlimentaireV1";
let state = {checks:{}, suivi:{a:[{},{},{},{}], b:[{},{},{},{}]}, rotation:0, cible:CIBLE_MOI_DEFAUT, cibleAutre:CIBLE_AUTRE_DEFAUT};
try{

    if(Number.isFinite(saved.cibleAutre) && saved.cibleAutre>=1000 && saved.cibleAutre<=3500) state.cibleAutre = saved.cibleAutre;
  }
}catch(e){ /* localStorage indisponible : le site marche quand même, sans sauvegarde */ }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* Semaines/courses actives, dérivées de la rotation en cours */
let SEMAINES = buildSemaines(state.rotation);
majPortions();
let LISTES = buildListes(state.rotation);

}

}

  html += `<section class="card"><h2>💶 Budget estimé par semaine (vous deux)</h2>
    <ul class="rayon" style="list-style:none">` +
    B.lignes.map(b=>`<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)"><span>${b[0]}</span><b>${b[1]}</b></li>`).join("") +
    `</ul>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>${B.total}</b><small>Total / semaine (vous deux)</small></div>
    </div>
    <div class="warn">⚠️ <span>Estimation en supermarché discount / marques distributeur, moyenne des 4 semaines. Le repas plaisir du samedi et le fond de placard ne sont pas comptés.</span></div>
  </section>`;
  return html;
}

/* --- Batch cooking --- */
function pageBatch(){
  return `<section class="card">
    <h2>🍳 Batch cooking du dimanche <span class="muted">(~30-35 min)</span></h2>
    <p class="muted">Une seule session de cuisine prépare les féculents, viandes et légumes de la semaine. Ensuite, chaque repas = assembler + réchauffer en moins de 10 minutes.</p>
    ${BATCH.map((s,i)=>`
    <div class="step">
      <div class="num">${i+1}</div>
      <div><b>${s[0]}</b><span>${s[1]}</span><br><small>⏱ ${s[2]}</small></div>
    </div>`).join("")}
    <div class="warn">⚠️ <span>Conservation : 3-4 jours max au réfrigérateur dans des boîtes fermées. Congèle les portions de jeudi/vendredi et sors-les la veille.</span></div>
  </section>`;
}

/* --- Tableau de suivi --- */
function tableSuivi(qui,label,placeholder){
  let rows = "";
  for(let w=0; w<4; w++){
    const s = state.suivi[qui][w] || {};
    rows += `<tr>
      <td><b>S${w+1}</b></td>
      <td><input type="number" step="0.1" min="0" placeholder="kg" data-suivi="poids" data-qui="${qui}" data-w="${w}" value="${s.poids??""}"></td>
      <td><input type="number" step="0.5" min="0" placeholder="cm" data-suivi="taille" data-qui="${qui}" data-w="${w}" value="${s.taille??""}"></td>
      <td><input type="text" placeholder="${placeholder}" data-suivi="note" data-qui="${qui}" data-w="${w}" value="${s.note??""}"></td>
    </tr>`;
  }
  return `<h2 style="margin-top:8px">${label}</h2>
    <div style="overflow-x:auto"><table>
      <thead><tr><th></th><th>Poids (kg)</th><th>Tour de taille (cm)</th><th>Remarques</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function pageSuivi(){
  return `<section class="card">
    <h2>📈 Tableau de suivi</h2>
    <p class="muted">Pèse-toi une fois par semaine, le même jour, le matin à jeun. Tout est sauvegardé automatiquement sur cet appareil.</p>
    ${tableSuivi("a","Suivi","Énergie, faim, handball…")}
    <div class="stats" style="margin-top:16px" id="suiviStats"></div>
  </section>`;
}

/* ==========================================================
   CONSTRUCTION DU DOM
   ========================================================== */
PAGES.forEach((p,i)=>{
  const b = document.createElement("button");
  b.textContent = p.label;
  b.dataset.page = p.id;
  if(i===0) b.classList.add("active");
  nav.appendChild(b);

  const sec = document.createElement("div");
  sec.className = "page" + (i===0?" visible":"");
  sec.id = "page-" + p.id;
  main.appendChild(sec);
});

document.getElementById("page-accueil").innerHTML = pageAccueil();
for(let w=0; w<4; w++) document.getElementById("page-s"+w).innerHTML = pageSemaine(w);
document.getElementById("page-rotations").innerHTML = pageRotations();
document.getElementById("page-courses").innerHTML = pageCourses();
document.getElementById("page-batch").innerHTML = pageBatch();
document.getElementById("page-suivi").innerHTML = pageSuivi();

/* ==========================================================
   INTERACTIONS
   ========================================================== */

/* Navigation entre onglets */
nav.addEventListener("click",e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===btn));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("visible"));
  document.getElementById("page-"+btn.dataset.page).classList.add("visible");
  window.scrollTo({top:0});
});

/* Re-génère toutes les pages (rotation ou portions modifiées) */
function rerenderAll(){
  LISTES = buildListes(state.rotation);
  document.getElementById("page-accueil").innerHTML = pageAccueil();
  for(let w=0; w<4; w++) document.getElementById("page-s"+w).innerHTML = pageSemaine(w);
  document.getElementById("page-rotations").innerHTML = pageRotations();
  document.getElementById("page-courses").innerHTML = pageCourses();
  for(let w=0;w<4;w++) for(let d=0;d<7;d++) refresh(w,d);
}

/* Objectif kcal / jour : mise à jour des portions */
main.addEventListener("change",e=>{
  const el = e.target;
  if(!el.matches("[data-cible]")) return;
  let v = parseInt(el.value,10);
  if(!Number.isFinite(v)) v = el.dataset.cible==="cible" ? CIBLE_MOI_DEFAUT : CIBLE_AUTRE_DEFAUT;
  state[el.dataset.cible] = Math.min(3500,Math.max(1000,v));
  save();
  majPortions();
  rerenderAll();
});

/* Changer de rotation de menus */
main.addEventListener("click",e=>{
  const btn = e.target.closest("[data-rotate]");
  if(!btn) return;
  const ok = confirm("Passer à la rotation suivante ? Tes coches de progression seront réinitialisées (ton suivi de poids est conservé).");
  if(!ok) return;
  state.rotation = (state.rotation+1) % NB_ROTATIONS;
  state.checks = {};
  save();
  SEMAINES = buildSemaines(state.rotation);
  rerenderAll();
  window.scrollTo({top:0});
});

/* Accordéon des jours */
main.addEventListener("click",e=>{
  const head = e.target.closest("[data-toggle]");
  if(!head) return;
  const day = head.parentElement;
  const body = day.querySelector(".day-body");
  const open = day.classList.toggle("open");
  head.setAttribute("aria-expanded", open);
  body.style.maxHeight = open ? body.scrollHeight + "px" : "0";
});

/* Cases à cocher des repas + champs du suivi */
main.addEventListener("change",e=>{
  const el = e.target;
  if(el.matches("input[type=checkbox][data-key]")){
    const key = el.dataset.key;
    if(el.checked) state.checks[key] = true;
    else delete state.checks[key];
    document.getElementById("card-"+key).classList.toggle("checked", el.checked);
    save();
    refresh(+el.dataset.w, +el.dataset.d);
    const body = el.closest(".day-body");
    if(body && body.parentElement.classList.contains("open"))
      body.style.maxHeight = body.scrollHeight + "px";
  }
  if(el.matches("[data-suivi]")){
    majChampSuivi(el);
    majSuivi();
  }
});
/* Sauvegarde aussi pendant la frappe dans le suivi */
main.addEventListener("input",e=>{
  if(e.target.matches("[data-suivi]")) majChampSuivi(e.target);
});
function majChampSuivi(el){
  const qui = el.dataset.qui, w = +el.dataset.w;
  state.suivi[qui][w] = state.suivi[qui][w] || {};
  state.suivi[qui][w][el.dataset.suivi] = el.value;
  save();
}

/* ==========================================================
   PROGRESSION — jour, semaine, global
   ========================================================== */
function compteJour(w,d){
  let done = 0;
  for(let m=0;m<4;m++) if(state.checks[`s${w}d${d}m${m}`]) done++;
  return done;
}
function refresh(w,d){
  const dj = compteJour(w,d);
  document.getElementById(`dbar-${w}-${d}`).style.width = (dj/4*100)+"%";
  document.getElementById(`dmsg-${w}-${d}`).classList.toggle("on", dj===4);
  document.getElementById(`day-${w}-${d}`).classList.toggle("done", dj===4);

  let ws = 0;
  for(let j=0;j<7;j++) ws += compteJour(w,j);
  const wpct = Math.round(ws/28*100);
  document.getElementById(`wbar-${w}`).style.width = wpct+"%";
  document.getElementById(`wpct-${w}`).textContent = wpct+" %";
  document.getElementById(`wmsg-${w}`).classList.toggle("on", ws===28);

  const total = Object.keys(state.checks).length;
  const gpct = Math.round(total/112*100);
  document.getElementById("globalBar").style.width = gpct+"%";
  document.getElementById("globalPct").textContent = gpct+" %";
}

/* Statistiques du suivi (perte pour chacun) */
function statPerte(qui,depart,objectif,emoji){
  const poids = state.suivi[qui].map(s=>parseFloat(s&&s.poids)).filter(v=>!isNaN(v));
  if(!poids.length) return `<div class="stat"><b>${emoji} —</b><small>Note un poids pour voir tes stats</small></div>`;
  const dernier = poids[poids.length-1];
  const perte = depart - dernier;
  return `
    <div class="stat"><b>${emoji} ${dernier} kg</b><small>Dernier poids noté</small></div>
    <div class="stat"><b>${perte>=0?"-":"+"}${Math.abs(perte).toFixed(1)} kg</b><small>Depuis le départ (${depart} kg)</small></div>
    <div class="stat"><b>${Math.max(0,dernier-objectif).toFixed(1)} kg</b><small>Restants vers ${objectif} kg</small></div>`;
}
function majSuivi(){
  document.getElementById("suiviStats").innerHTML =
    statPerte("a",105,87.5,"⚖️");
}

/* ==========================================================
   SAUVEGARDE — export / import du fichier JSON
   ========================================================== */
document.getElementById("btnExport").addEventListener("click",()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0,10);
  a.download = `plan-alimentaire-sauvegarde-${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btnImport").addEventListener("click",()=>{
  document.getElementById("fileImport").click();
});
document.getElementById("fileImport").addEventListener("change",e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data.checks && !data.suivi) throw new Error("format");
      state = Object.assign({checks:{},suivi:{a:[{},{},{},{}],b:[{},{},{},{}]},rotation:0,cible:CIBLE_MOI_DEFAUT,cibleAutre:CIBLE_AUTRE_DEFAUT}, data);
      save();
      location.reload(); /* recharge la page avec les données importées */
    }catch(err){
      alert("Fichier de sauvegarde invalide.");
    }
  };
  r.readAsText(f);
});

/* Initialisation : appliquer l'état sauvegardé */
for(let w=0;w<4;w++) for(let d=0;d<7;d++) refresh(w,d);
majSuivi();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW non enregistré :", err));
  });
}
</script>
